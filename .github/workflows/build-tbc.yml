
name: AscEmu TBC Build

on:
  push:
    branches:
      - tbc-2.4.3-D4938
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B ascemu_build -G "Visual Studio 17 2022" -A x64 -T v142 -DBUILD_WITH_WARNINGS=0 -DBUILD_TOOLS=1 -DASCEMU_VERSION=TBC
      - name: Build AscEmu
        run: cmake --build ascemu_build --config Release --parallel 2

      - name: Install AscEmu
        run: cmake --install ascemu_build --config Release --prefix "${{ github.workspace }}/AscEmu-Server"

      - name: Copy generated configs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "AscEmu-Server\configs" | Out-Null
          Copy-Item "configs\*.conf" "AscEmu-Server\configs\" -Force

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path "AscEmu-Server\*" -DestinationPath "AscEmu-TBC-Server.zip" -Force

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tbc-build-${{ github.run_number }}
          name: AscEmu TBC Build ${{ github.run_number }}
          files: AscEmu-TBC-Server.zip
          fail_on_unmatched_files: true
          make_latest: false
